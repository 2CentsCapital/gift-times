name: GIFT Times — ingest + newsletter (6am & 4pm IST)

# Twice daily. Ingest runs first, then the newsletter (only new items since
# the last send). Scheduled early to absorb GitHub's cron delay (often ~1-2h)
# so mail lands by ~8am and ~6pm IST.
#   00:30 UTC = 06:00 IST, 10:30 UTC = 16:00 IST.
on:
  schedule:
    - cron: "30 0 * * *"
    - cron: "30 10 * * *"
  workflow_dispatch:
    inputs:
      send_newsletter:
        description: "Send the newsletter after ingest?"
        type: boolean
        default: false
      resend_last:
        description: "Only resend the last edition to the addresses in the NEWSLETTER_RESEND_TO secret (no ingest)"
        type: boolean
        default: false
      dry_run:
        description: "With resend_last: show who would get it, send nothing"
        type: boolean
        default: true

jobs:
  daily:
    # Only the canonical repo ingests and mails. A copy or fork with its own
    # secrets would otherwise write to another database and mail subscribers twice.
    if: github.repository == '2CentsCapital/gift-times'
    runs-on: ubuntu-latest
    concurrency:
      group: gift-times-daily
      cancel-in-progress: false
    env:
      SUPABASE_URL: ${{ secrets.SUPABASE_URL }}
      SUPABASE_SERVICE_ROLE_KEY: ${{ secrets.SUPABASE_SERVICE_ROLE_KEY }}
      RESEND_API_KEY: ${{ secrets.RESEND_API_KEY }}
      FROM_EMAIL: ${{ secrets.FROM_EMAIL }}
      OWNER_EMAIL: ${{ secrets.OWNER_EMAIL }}
      SITE_URL: ${{ secrets.SITE_URL }}
      # Signs the per-subscriber unsubscribe links; must match the site's value.
      UNSUB_SECRET: ${{ secrets.UNSUB_SECRET }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install deps
        run: npm ci --omit=optional || npm install

      - name: Ingest IFSCA data
        if: ${{ !inputs.resend_last }}
        run: node scripts/ingest.mjs

      - name: Send newsletter
        # Sends on the scheduled run, or on manual runs only if requested.
        if: ${{ !inputs.resend_last && (github.event_name == 'schedule' || inputs.send_newsletter) }}
        run: node scripts/send-newsletter.mjs

      - name: Resend last edition
        # For subscribers a send missed (their addresses come by mail to the
        # owners). The list sits in a secret because this repo's logs are public.
        if: ${{ inputs.resend_last }}
        env:
          RESEND_TO: ${{ secrets.NEWSLETTER_RESEND_TO }}
          DRY_RUN: ${{ inputs.dry_run }}
        run: node scripts/send-newsletter.mjs --resend-last

      - name: Daily subscriber report (owner only, morning run)
        # Once a day (06:00 IST run) + on manual dispatch. Emails the owner only
        # on days with new sign-ups (set ALERT_ALWAYS=true to send daily).
        # Runs even when a newsletter send missed someone and failed the step.
        if: ${{ !cancelled() && !inputs.resend_last && (github.event.schedule == '30 0 * * *' || github.event_name == 'workflow_dispatch') }}
        run: node scripts/subscriber-alert.mjs
